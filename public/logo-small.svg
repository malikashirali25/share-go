<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#3B82F6" opacity="0.1"/>
  
  <!-- Simplified sharing symbol -->
  <g transform="translate(8, 8)">
    <!-- Left hand -->
    <path d="M6 8 C6 6, 8 5, 10 6 C12 7, 13 9, 12 11 C11 13, 9 14, 7 13 C5 12, 4 10, 5 8 C6 6, 8 5, 10 6" 
          fill="#3B82F6"/>
    
    <!-- Right hand -->
    <path d="M14 6 C16 5, 18 6, 19 8 C20 10, 19 12, 17 13 C15 14, 13 13, 12 11 C11 9, 12 7, 14 6" 
          fill="#10B981"/>
    
    <!-- Exchange arrow -->
    <path d="M10 9 L14 9 M12 7 L14 9 L12 11" 
          stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="45" y="16" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2937">
    Share &amp; Go
  </text>
  
  <!-- Tagline -->
  <text x="45" y="28" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="400" fill="#6B7280">
    Community Sharing
  </text>
</svg>


